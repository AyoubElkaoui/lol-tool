<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://ddragon.leagueoflegends.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>LoL Tool overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 12px/1.35 "Segoe UI", system-ui, sans-serif; color: #f0e6d2; user-select: none; }
    .panel { margin: 4px; padding: 8px 10px; background: rgba(1, 10, 19, 0.82); border: 1px solid #785a28; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
    .panel.hidden { display: none; }
    .head { display: flex; justify-content: space-between; color: #c8aa6e; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; margin-bottom: 6px; }
    .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .row img { width: 22px; height: 22px; border: 1px solid #463714; border-radius: 2px; }
    .warn { color: #ff6b5e; font-weight: 600; }
    .ok { color: #4fd18b; }
    .bad { color: #ff9a5e; }
    .muted { color: #a09b8c; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: rgba(200,170,110,.12); border-radius: 3px; padding: 1px 6px; }
    .soon { color: #0ac8b9; font-weight: 700; }
    b { color: #f0e6d2; }
    .sect { margin-top: 8px; color: #c8aa6e; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .alert { margin: 5px 0; padding: 4px 7px; border-left: 3px solid #c8aa6e; background: rgba(200,170,110,.10); border-radius: 2px; }
    .alert.ok { border-color: #4fd18b; background: rgba(79,209,139,.10); }
    .alert.warn { border-color: #ff6b5e; background: rgba(255,107,94,.12); }
    .alert.bad { border-color: #ff9a5e; background: rgba(255,154,94,.10); }
    .tip { margin: 4px 0; color: #d9cfb8; }
    .tip.ok { color: #4fd18b; } .tip.bad { color: #ff9a5e; } .tip.warn { color: #ff6b5e; }
    .items { gap: 3px; }
    .items .big img { border-color: #c8aa6e; }
    .team { display: flex; gap: 4px; margin-top: 3px; }
    .mate { position: relative; display: flex; flex-direction: column; align-items: center; width: 56px; }
    .mate img { width: 30px; height: 30px; border: 1px solid #463714; border-radius: 3px; }
    .mate i { position: absolute; top: 18px; left: 33px; font-style: normal; font-size: 10px; background: #010a13; border: 1px solid #463714; border-radius: 3px; padding: 0 3px; }
    .mate small { font-size: 10px; color: #a09b8c; }
    .mate.fed img { border-color: #ff6b5e; box-shadow: 0 0 4px #ff6b5e; }
    .mate.fed small { color: #ff6b5e; }
    .mate.mine img { border-color: #c8aa6e; }
    .mate.dead img { filter: grayscale(1) brightness(.5); }
    .mate.dead i { color: #0ac8b9; }
  </style>
</head>
<body>
  <div id="panel" class="panel hidden"></div>
  <script src="overlay.js"></script>
</body>
</html>
